# User manual for gentle-speak, built by GitHub Pages from the /docs folder of main.
# No local build step: GitHub Pages runs Jekyll with the just-the-docs remote theme.

title: gentle-speak
description: >-
  Opt-in, local text-to-speech for Gentle Shell (Pi). It reads the agent's
  questions and results aloud with Piper, Qwen3-TTS or your system voice.
url: https://e-evolution.github.io
baseurl: /gentle-speak
lang: en

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

logo: /assets/images/logo.svg
color_scheme: gentle

search_enabled: true
search:
  heading_level: 2
  previews: 3
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: Back to top

aux_links:
  "gentle-speak on GitHub":
    - "https://github.com/e-Evolution/gentle-speak"
aux_links_new_tab: true

footer_content: >-
  MIT License · e-Evolution Consultants S.A. · Community extension for Gentle
  Shell, not affiliated with Gentleman Programming

mermaid:
  version: "11.4.1"

callouts_level: loud
callouts:
  note:
    title: Note
    color: green
  warning:
    title: Warning
    color: red

# Social card image (jekyll-seo-tag og:image) for every page.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/preview.png

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
